# TWRP 版 WiFi 配置（部署到设备 /data/adb/twrp-wifi.conf）
# 改这里，不要改模块脚本。部署：adb push twrp/config/twrp-wifi.conf /data/adb/twrp-wifi.conf

WIFI_SSID="mywifi"
WIFI_PSK="mypassword"

# 静态 IP：填了就用静态；留空则 DHCP
WIFI_IP="192.168.31.100"
WIFI_MASK="255.255.255.0"
WIFI_GW="192.168.31.1"
WIFI_DNS1="192.168.31.1"
WIFI_DNS2="223.5.5.5"
